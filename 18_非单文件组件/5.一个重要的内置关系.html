<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../js/vue.js"></script>
    <title>一个重要的内置关系</title>
</head>
<body>
    <div id="root">
        <school></school>
    </div>
</body>
<script>
    const school = Vue.extend({
        template: `
            <div>
                <h2>学校名称：{{ name }}</h2>    
                <h2>学校地址：{{ address }}</h2>   
                <button @click='showX'>点我展示x</button> 
            </div>
        `,
        data() {
            return {
                name: '长安大学',
                address: '西安'
            }
        },
        methods: {
            showX() {
                console.log(this.x)                
            }
        },
    })

    Vue.prototype.x = 100
    const vm = new Vue({
        el: '#root',
        data: {
            msg: '天天好心情'
        },
        components: {
            school
        }
    })
    console.log(school.prototype.__proto === vm.prototype)    
    console.log(vm)    
</script>
</html>
