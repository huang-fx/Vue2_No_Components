<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../js/vue.js"></script>
    <title>组件的嵌套</title>
</head>
<body>
    <div id="root">
        
    </div>
</body>
<script>
    // student组件
    const student = Vue.extend({
        template: `
            <div>
                <h2>学生姓名：{{ name }}</h2>
                <h2>学生年龄：{{ age }}</h2>
            </div>
        `, 
        data() {
            return {
                name: '小张',
                age: 18
            }
        }
    })

    // school组件
    const school = Vue.extend({
        template: `
            <div>
                <h2>学校名称：{{ name }}</h2>
                <h2>学校地址：{{ address }}</h2>
                <student></student>
            </div>
        `, 
        data() {
            return {
                name: '尚硅谷',
                address: '沈阳'
            }
        },
        components: {
            student
        }
    })

    // hello组件
    const hello = Vue.extend({
        template: '<h1>{{ msg }}</h1>',
        data() {
            return { msg: '欢迎来沈阳！' }
        }
    })

    // app组件
    const app = Vue.extend({
        template: `
            <div>
                <school></school>
                <hello></hello>
            </div>
        `,
        components: {
            school,
            hello
        }
    })

    new Vue({
        el: '#root',
        template: '<app></app>',
        components: {
            app
        }
    })
</script>
</html>
