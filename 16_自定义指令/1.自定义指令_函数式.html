<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../js/vue.js"></script>
    <title>自定义指令-函数式</title>
</head>
<body>
    <div id="root">
        <h2>n的初始值为：<span v-text="n"></span></h2>
        <h2>n的被放大10之后的值为：<span v-big="n"></span></h2>
        <button @click="n++">n值+1</button>
    </div>
</body>
<script>
    new Vue({
        el: '#root',
        data: {
            n: 1
        },
        directives: {
            big(element, binding) {
                console.log('big')
                console.log(element)                
                console.log(binding)                
                element.innerText = binding.value * 10
            }
        }
    })
</script>
</html>
