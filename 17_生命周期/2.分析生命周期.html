<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分析生命周期</title>
    <script src="../js/vue.js"></script>
</head>
<body>
    <div id="root">
        <h2 v-text="n"></h2>
        <h2>n的值为：{{ n }}</h2>
        <button @click="add">n值+1</button>
        <button @click="bye">销毁Vue实例</button>
    </div>
</body>
<script>
    new Vue({
        el: '#root',   // 如果这里不写 就要利用vm.$mount('#root')添加el 否则无法向下进行
        data: {
            n: 1
        },
        // template: 
        //     `
        //     <div>
        //         <h2>n的值为：{{ n }}</h2>
        //         <button @click="add">n值+1</button>
        //     </div>`
        // ,
        methods: {
            add() {  
                console.log('add')                
                this.n++
            },
            bye() {
                console.log('bye')
                this.$destroy()
            }
        },
        beforeCreate() {
            console.log('beforeCreate')
            console.log(this) 
            debugger;           
        },
        created() {
            console.log('created')     
            console.log(this) 
            debugger       
        },
        beforeMount() {
            console.log('beforeMount')
            console.log(this) 
            debugger
        },
        mounted() {
            console.log('mounted')
        },
        beforeUpdate() {
            console.log('beforeUpdate')
        },
        updated() {
            console.log('updated')
            // this.n = 110    // 这里面改变 n 值会引起 n 值的变化 但如果在beforeDestroy中改变n值 则不起作用
        },
        beforeDestroy() {
            console.log('beforeDestroy')
        },
    })
</script>
</html>
