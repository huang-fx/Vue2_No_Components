<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>总结生命周期</title>
    <script src="../js/vue.js"></script>
</head>
<body>
    <div id="root">
        <h2 :style="{opacity}">欢迎来到沈阳</h2>
        <button @click="opacity = 1">点我还原透明度</button>
        <button @click="stop">点我停止变换</button>
    </div>
</body>
<script>
    new Vue({
        el: '#root',
        data: {
            opacity: 1
        },
        methods: {
            stop() {
                this.$destroy()
            }
        },
        mounted() {
            this.timer = setInterval(() => {  
                this.opacity -= 0.01
                if(this.opacity <= 0) this.opacity = 1
            }, 16)
        },
        beforeDestroy() {
            clearInterval(this.timer)
        }
    })

    // 一种不被推荐的写法
    // setInterval(() => {
    //     vm.opacity -= 0.01
    //     if(vm.opacity <= 0) vm.opacity = 1
    // }, 16)
</script>
</html>
