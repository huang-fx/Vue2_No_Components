<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>条件渲染</title>
    <script src="../js/vue.js"></script>
</head>
<body>
    <div id="root">
        <h2 v-show="true">欢迎来到{{ name }}</h2>
        <h2 v-show="1===1">欢迎来到{{ name }}</h2>
        <h2 v-if="true">欢迎来到{{ name }}</h2>
        <h2 v-if="1===1">欢迎来到{{ name }}</h2>
        <h2>当前n的值是：{{ n }}</h2>
        <button @click="n++">点我n + 1</button>
        <div v-if="n === 1">111111</div>
        <div v-if="n === 2">222222</div>
        <div v-if="n === 3">333333</div>
        <template v-if="n === 2">
            <h2>李子坝</h2>
            <h2>龙门浩</h2>
            <h2>洪崖洞</h2>
        </template>
    </div>
</body>
<script>
    const vm = new Vue({
        el: '#root',
        data: {
            name: '尚硅谷',
            n: 0
        }
    })
</script>
</html>
