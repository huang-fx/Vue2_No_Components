<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../js/vue.js"></script>
    <title>v-text指令</title>
</head>
<body>
    <div id="root">
        <div>你好，{{ name }}</div>
        <div>{{ str }}</div>
        <div v-text="name"></div>
        <div v-text="name">你好，</div>
        <div v-text="str"></div>
    </div>
</body>
<script>
    new Vue({
        el: '#root',
        data: {
            name: '尚硅谷',
            str: '<h3>你好生活</h3>'
        }
    })
</script>
</html>
