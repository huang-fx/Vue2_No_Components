<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基本列表</title>
    <script src="../js/vue.js"></script>
</head>
<body>
    <div id="root">
        <!-- 遍历数组 -->
        <h2>人员列表</h2>
        <ul>
            <li v-for="(p, index) in persons" :key="index">
                {{ p.name }}-{{ p.age }}
            </li>
        </ul>
        <!-- 遍历对象 -->
        <h2>汽车信息</h2>
        <ul>
            <li v-for="(qc, index) in car" :key="index">
                {{ index }}-{{ qc }}
            </li>
        </ul>
        <!-- 遍历字符串 -->
        <h2>遍历字符串</h2>
        <ul>
            <li v-for="(char, index) in str" :key="index">
                {{ index }}-{{ char }}
            </li>
        </ul>
        <!-- 遍历指定次数 -->
        <h2>遍历指定次数</h2>
        <ul>
            <li v-for="(number, index) in 5" :key="index">
                {{ index }}-{{ number }}
            </li>
        </ul>
    </div>
</body>
<script>
    const vm = new Vue({
        el: '#root',
        data: {
            persons: [
                {id: 1, name: '张三', age: 18},
                {id: 2, name: '李四', age: 19},
                {id: 3, name: '王五', age: 20}
            ],
            car: {
                name: '奥迪A6',
                price: '60W',
                color: 'black'
            },
            str: 'string'
        }
    })
</script>
</html>
