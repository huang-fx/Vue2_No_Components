<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>key的原理</title>
    <script src="../js/vue.js"></script>
</head>
<body>
    <div id="root">
        <!-- 遍历数组 -->
        <h2>人员列表</h2>
        <button @click.once="add">添加人员</button>
        <ul>
            <!-- <li v-for="(p, index) in persons" :key="index"> -->
            <li v-for="p in persons" :key="p.id">
                {{ p.name }}-{{ p.age }}
                <input type="text">
            </li>
        </ul>
        
    </div>
</body>
<script>
    const vm = new Vue({
        el: '#root',
        data: {
            persons: [
                {id: 1, name: '张三', age: 18},
                {id: 2, name: '李四', age: 19},
                {id: 3, name: '王五', age: 20}
            ]
        },
        methods: {
            add() {
                const p = {id: 4, name: '老张', age: 30}
                this.persons.unshift(p)
            }
        }
    })
</script>
</html>
