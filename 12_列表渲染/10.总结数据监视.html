<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>总结数据监视</title>
    <script src="../js/vue.js"></script>
</head>
<body>
    <div id="root">
        <h2>学生信息</h2>
        <button @click="student.age++">年龄+1岁</button><br><br>
        <button @click="addSex">添加性别属性:(默认男)</button><br><br>
        <button @click="student.sex = '女' ">修改性别</button><br><br>
        <button @click="addFriend">在首位添加一个朋友</button><br><br>
        <button @click="updateFirstFriendName">修改第一个朋友的名字为: 张三</button><br><br>
        <button @click="addHobby">添加一个爱好</button><br><br>
        <button @click="updateHobby">将第一个爱好修改为开车</button><br><br>
        <button @click="removeSmoke">过滤掉爱好中的抽烟</button>

        <h3>姓名：{{ student.name }}</h3>
        <h3>年龄：{{ student.age }}</h3>
        <h3 v-if="student.sex">性别：{{ student.sex }}</h3>
        <h3>爱好：</h3>
        <ul>
            <li v-for="(h, index) in student.hobby" :key="index">
                {{ h }}
            </li>
        </ul>
        <h3>朋友们：</h3>
        <ul>
            <li v-for="(f, index) in student.friends" :key="index">
                {{ f.name }} -- {{ f.age }}
            </li>
        </ul>
    </div>
<script>
    const vm = new Vue({
        el: '#root',
        data: {
            student: {
                name: '珊莎',
                age: 18,
                hobby: ['抽烟', '喝酒', '烫头'],
                friends: [
                    {name: '琼恩雪诺', age: 30},
                    {name: '坦格利安', age: 25}
                ]              
            }
        },
        methods: {
            addSex() {
                Vue.set(this.student, 'sex', '男')
            },
            addFriend() {
                this.student.friends.unshift({name: '提利昂', age: 36})
            },
            updateFirstFriendName() {
                this.student.friends[0].name = '张三'
            },
            addHobby() {
                this.student.hobby.push('学习')
            },
            updateHobby() {
                this.student.hobby.splice(0, 1, '开车')
            },
            removeSmoke() {
                this.student.hobby = this.student.hobby.filter((h) => {
                    return h !== '抽烟'
                })
            }
        },
    })
</script>    
</body>
</html>
