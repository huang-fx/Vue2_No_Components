<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>更新时的一个问题</title>
    <script src="../js/vue.js"></script>
</head>
<body>
    <div id="root">
        <ul>
            <button @click="updateMa">更新马冬梅的信息</button>
            <li v-for="(p, index) in persons" :key="p.id">
                {{ p.name }}-{{ p.age }}-{{ p.sex }}
            </li>
        </ul>
    </div>
</body>
<script>
    const vm = new Vue({
        el: '#root',
        data: {
            keyWord: '',
            sortType: 0,
            persons: [
                {id: '001', name: '马冬梅', age: 39, sex: '女'},
                {id: '002', name: '周冬雨', age: 19, sex: '女'},
                {id: '003', name: '周杰伦', age: 26, sex: '男'},
                {id: '004', name: '温兆伦', age: 21, sex: '男'}
            ]
        },
        methods: {
            updateMa() {
                // this.persons[0].name = '马保国',
                // this.persons[0].age = 50,
                // this.persons[0].sex = '男'
                this.persons[0] = { name: '马保国', age: 50, sex: '男' }
            }
        }
    })
</script>
</html>
