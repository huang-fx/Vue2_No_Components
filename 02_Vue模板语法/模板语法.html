<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模板语法</title>
    <script src="../js/vue.js"></script>
</head>
<body>
    <div class="root">
        <h1>Hello, {{ name }}</h1>
        <a v-bind:href="school.url">去{{ school.name }}学习</a>
        <a :href="school.url">去{{ school.name }}学习</a>
    </div>
    <script>
        Vue.config.productionTip = false   // 阻止 vue 在启动时生成生产提示
        new Vue({
            el: '.root',
            data: {
                name: 'jack',
                school: {
                    name: '尚硅谷',
                    url: 'https://www.atguigu.com'
                }
            }
        })
    </script>
</body>
</html>
