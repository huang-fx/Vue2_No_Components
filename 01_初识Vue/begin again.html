<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>begin again</title>
    <script src="../js/vue.js"></script>
</head>
<body>
    <div class="root">
        <h1>Hello, {{ name }}, {{ address}} </h1>
    </div>
    <script>
        Vue.config.productionTip = true   // 阻止 vue 在启动时生成生产提示
        new Vue({
            el: '.root',
            data: {
                name: '尚硅谷',
                address: '上海'
            }
        })
    </script>
</body>
</html>
