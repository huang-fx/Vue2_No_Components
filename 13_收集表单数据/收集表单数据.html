<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>收集表单数据</title>
    <script src="../js/vue.js"></script>
</head>
<body>
    <div id="root">
        <form @submit.prevent="over">
            账号：<input type="text" v-model="userInfo.account"><br/><br/>
            密码：<input type="password" v-model="userInfo.password"><br/><br/>
            性别：
            男<input type="radio" name="sex" v-model="userInfo.sex" value="男">
            女<input type="radio" name="sex" v-model="userInfo.sex" value="女"><br/><br/>
            爱好：
            抽烟<input type="checkbox" v-model="userInfo.hobby" value="smoke">
            喝酒<input type="checkbox" v-model="userInfo.hobby" value="drink">
            烫头<input type="checkbox" v-model="userInfo.hobby" value="permed">
            所属校区：
            <select v-model="userInfo.city">
                <option value="">请选择校区</option>
                <option value="beijing">北京</option>
                <option value="shenzhen">深圳</option>
                <option value="chongqing">重庆</option>
            </select>
            <br/><br/>
            其他信息：
            <textarea v-model="userInfo.desp"></textarea><br/><br/>
            <input type="checkbox" v-model="userInfo.agree">阅读并接受<a href="http://www.baidu.com">《用户协议》</a><br/><br/>
            <button>提交</button>
        </form>
    </div>
</body>
<script>
    const vm = new Vue({
        el: '#root',
        data: {
            userInfo: {
                account: '',
                password: '',
                sex: '',
                hobby: [],
                city: '',
                desp: '',
                agree: ''
            }
        },
        methods: {
            over() {
                console.log(JSON.stringify(this.userInfo))            
            } 
        }
    })
</script>
</html>
